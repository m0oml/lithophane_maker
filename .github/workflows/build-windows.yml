name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build
        # A folder build, not --onefile: one-file exes unpack to %TEMP% on every start,
        # which antivirus often blocks ("Failed to extract entry").
        # PyOpenGL picks its platform module at runtime, so bundle all of it.
        run: |
          pyinstaller --noconfirm --windowed --name LithophaneMaker --collect-submodules OpenGL --exclude-module pyqtgraph.jupyter src/lithophane/main.py
          Compress-Archive -Path dist/LithophaneMaker -DestinationPath dist/LithophaneMaker-windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: LithophaneMaker-windows
          path: dist/LithophaneMaker-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/LithophaneMaker-windows.zip --title ${{ github.ref_name }} --generate-notes
