name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build
        # PyOpenGL picks its platform module at runtime, so bundle all of it.
        run: >
          pyinstaller --noconfirm --onefile --windowed --name LithophaneMaker
          --collect-submodules OpenGL --exclude-module pyqtgraph.jupyter
          src/lithophane/main.py

      - uses: actions/upload-artifact@v5
        with:
          name: LithophaneMaker-windows
          path: dist/LithophaneMaker.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/LithophaneMaker.exe --title ${{ github.ref_name }} --generate-notes
