name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            package: LithophaneMaker-windows.zip
          # The oldest supported Ubuntu, so the app runs on older Linux installs too.
          - os: ubuntu-22.04
            package: LithophaneMaker-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build
        # A folder build, not --onefile: one-file apps unpack to a temp folder on every
        # start, which fails when that disk is full or antivirus blocks it.
        # PyOpenGL picks its platform module at runtime, so bundle all of it.
        run: >
          pyinstaller --noconfirm --windowed --name LithophaneMaker
          --collect-submodules OpenGL --exclude-module pyqtgraph.jupyter
          src/lithophane/main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/LithophaneMaker -DestinationPath dist/${{ matrix.package }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/${{ matrix.package }} -C dist LithophaneMaker

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: packages
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} packages/*
          --repo ${{ github.repository }} --title "Lithophane Maker ${{ github.ref_name }}"
          --generate-notes
